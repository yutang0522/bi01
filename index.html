<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent 自动化使用情况周报</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0f0b10;color:#f0e6eb;font-family:'Noto Sans TC',sans-serif;padding:2rem 1.5rem;min-height:100vh;}
@media(max-width:700px){body{padding:1rem;}}
.top-bar{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:1.5rem;}
.live-dot{width:8px;height:8px;border-radius:50%;background:#f472b6;animation:blink 1.5s infinite;flex-shrink:0;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}
.top-title{font-size:20px;font-weight:500;color:#fff;}
.top-sub{font-size:12px;color:rgba(203,213,225,0.5);margin-top:3px;}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.pill{font-size:12px;padding:5px 14px;border-radius:20px;border:0.5px solid rgba(244,114,182,0.35);color:#f9a8d4;background:rgba(244,114,182,0.08);cursor:pointer;}
.pill:hover{background:rgba(244,114,182,0.16);}
.pill-report{font-size:12px;padding:5px 14px;border-radius:20px;border:0.5px solid rgba(251,113,133,0.45);color:#fda4af;background:rgba(251,113,133,0.1);cursor:pointer;display:flex;align-items:center;gap:6px;}
.pill-report:hover{background:rgba(251,113,133,0.18);}
.report-icon{width:12px;height:12px;border:1.5px solid currentColor;border-radius:2px;flex-shrink:0;}
.status-badge{font-size:12px;padding:5px 12px;border-radius:20px;display:flex;align-items:center;gap:6px;background:#1a0f14;color:rgba(255,255,255,0.35);}
.status-badge.ok{background:rgba(244,114,182,0.1);color:#f9a8d4;border:0.5px solid rgba(244,114,182,0.3);}
.status-badge.err{background:rgba(251,100,80,0.1);color:#fca5a5;border:0.5px solid rgba(251,100,80,0.25);}
.status-badge.loading{background:rgba(251,113,133,0.1);color:#fda4af;border:0.5px solid rgba(251,113,133,0.3);}
.sdot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.sdot.blink{animation:blink 1.2s infinite;}
.sec-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.sec-line{width:3px;height:14px;border-radius:2px;background:#f472b6;flex-shrink:0;}
.sec-title{font-size:13px;font-weight:500;color:#fff;letter-spacing:.06em;text-transform:uppercase;}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1.5rem;}
@media(max-width:600px){.metrics{grid-template-columns:repeat(2,1fr);}}
.mc{background:#1a0f14;border-radius:10px;padding:14px 16px;border:0.5px solid rgba(244,114,182,0.12);}
.mc-bar{height:2px;border-radius:2px;margin-bottom:10px;}
.b1{background:linear-gradient(90deg,#f472b6,#a78bfa);}
.b2{background:linear-gradient(90deg,#a78bfa,#60a5fa);}
.b3{background:linear-gradient(90deg,#60a5fa,#34d399);}
.b4{background:linear-gradient(90deg,#34d399,#fb923c);}
.mc-label{font-size:13px;color:#fff;margin-bottom:5px;}
.mc-val{font-size:24px;font-weight:500;color:#fff;}
.mc-note{font-size:11px;margin-top:4px;color:#94a3b8;}
.kanban{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:1.5rem;}
.week-col{background:#1a0f14;border-radius:12px;overflow:hidden;border:0.5px solid rgba(244,114,182,0.12);}
.wh-bar{height:2px;}
.week-head{padding:10px 14px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;border-bottom:0.5px solid rgba(244,114,182,0.1);}
.week-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.week-label{color:rgba(255,255,255,0.85);}
.week-period{font-size:12px;color:rgba(255,255,255,0.35);margin-left:auto;}
.week-body{padding:10px;}
.section{margin-top:8px;}
.stag{display:inline-flex;align-items:center;font-size:12px;font-weight:500;padding:3px 9px;border-radius:20px;margin-bottom:6px;background:rgba(244,114,182,0.1);color:#f9a8d4;border:0.5px solid rgba(244,114,182,0.22);}
.card{background:#0f0b10;border:0.5px solid rgba(244,114,182,0.08);border-radius:8px;padding:10px 12px;margin-bottom:6px;}
.sr{display:flex;justify-content:space-between;padding:3px 0;border-bottom:0.5px solid rgba(244,114,182,0.08);}
.sr:last-child{border-bottom:none;}
.sk{font-size:13px;color:#94a3b8;}
.sv{font-size:13px;font-weight:500;color:#fff;}
.sv-hi{color:#f472b6;}
.pt{font-size:14px;font-weight:500;color:#e2e8f0;margin-bottom:4px;}
.pd{font-size:13px;color:#cbd5e1;line-height:1.6;margin-bottom:4px;}
.pr{font-size:13px;color:#a5b4fc;line-height:1.6;}
.pr::before{content:"→ ";opacity:0.7;}
.ri-label{font-size:12px;font-weight:500;color:#f9a8d4;margin-bottom:4px;}
.ri{font-size:13px;color:#e2e8f0;line-height:1.6;margin-bottom:6px;}
.ri:last-child{margin-bottom:0;}
.func-tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;background:rgba(148,163,184,0.07);border:0.5px solid rgba(148,163,184,0.18);color:#cbd5e1;margin:2px;}
.pi{display:flex;gap:4px;padding:3px 0;border-bottom:0.5px solid rgba(244,114,182,0.06);}
.pi:last-child{border-bottom:none;}
.pt2{font-size:13px;color:#cbd5e1;line-height:1.5;}
.two{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:1.5rem;}
@media(max-width:600px){.two{grid-template-columns:1fr;}}
.chart-card{background:#1a0f14;border:0.5px solid rgba(244,114,182,0.12);border-radius:12px;padding:14px 16px;}
.chart-title{font-size:13px;font-weight:500;color:rgba(255,255,255,0.6);margin-bottom:12px;}
.cw{position:relative;width:100%;height:180px;}
.divider{border:none;border-top:0.5px solid rgba(244,114,182,0.08);margin:1.25rem 0;}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
.badge{font-size:12px;padding:2px 9px;border-radius:20px;background:#1a0f14;color:rgba(255,255,255,0.45);border:0.5px solid rgba(244,114,182,0.14);}

/* 第六项：价值判断 */
.value-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:1.5rem;}
@media(max-width:600px){.value-grid{grid-template-columns:1fr;}}
.value-card{background:#1a0f14;border:0.5px solid rgba(244,114,182,0.12);border-radius:10px;padding:12px 14px;}
.value-label{font-size:11px;font-weight:500;color:#f472b6;letter-spacing:.05em;margin-bottom:6px;}
.value-text{font-size:13px;color:#cbd5e1;line-height:1.7;}

/* 第七项：风险 */
.risk-list{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:1.5rem;}
.risk-card{background:#1a0f14;border:0.5px solid rgba(251,100,80,0.15);border-radius:10px;padding:12px 14px;}
.risk-title{font-size:12px;font-weight:500;color:#fca5a5;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.risk-dot{width:5px;height:5px;border-radius:50%;background:#fca5a5;flex-shrink:0;}

/* 第八项：演进计划 */
.plan-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:1.5rem;}
@media(max-width:600px){.plan-grid{grid-template-columns:1fr;}}
.plan-card{background:#1a0f14;border:0.5px solid rgba(167,139,250,0.18);border-radius:10px;padding:12px 14px;}
.plan-num{font-size:11px;font-weight:500;color:#a78bfa;margin-bottom:6px;}
.plan-desc{font-size:13px;color:#e2e8f0;line-height:1.6;margin-bottom:6px;}
.plan-meta{font-size:12px;color:#64748b;display:flex;flex-direction:column;gap:2px;}
.plan-kpi{font-size:12px;color:#94a3b8;margin-top:4px;padding-top:4px;border-top:0.5px solid rgba(167,139,250,0.1);}

/* Modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:100;align-items:flex-start;justify-content:center;padding:2rem 1rem;overflow-y:auto;}
.modal-overlay.show{display:flex;}
.modal{background:#1a0f14;border-radius:16px;border:0.5px solid rgba(244,114,182,0.3);width:100%;max-width:660px;}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:0.5px solid rgba(244,114,182,0.1);}
.modal-title{font-size:15px;font-weight:500;color:#fff;display:flex;align-items:center;gap:8px;}
.modal-close{font-size:12px;padding:4px 12px;border-radius:20px;border:0.5px solid rgba(255,255,255,0.15);background:transparent;color:rgba(255,255,255,0.5);cursor:pointer;}
.modal-close:hover{background:rgba(255,255,255,0.08);}
.modal-tabs{display:flex;gap:4px;padding:12px 20px 0;}
.tab{font-size:13px;padding:6px 16px;border-radius:8px 8px 0 0;cursor:pointer;color:rgba(255,255,255,0.4);background:transparent;border:0.5px solid transparent;}
.tab.active{background:#0f0b10;color:#f9a8d4;border-color:rgba(244,114,182,0.3);}
.tab:hover:not(.active){color:rgba(255,255,255,0.65);}
.modal-divider{border:none;border-top:0.5px solid rgba(244,114,182,0.08);}
.custom-select{padding:12px 20px;border-bottom:0.5px solid rgba(244,114,182,0.08);display:none;}
.custom-select.show{display:block;}
.custom-label{font-size:12px;color:rgba(255,255,255,0.45);margin-bottom:8px;}
.week-cbs{display:flex;flex-wrap:wrap;gap:10px;}
.week-cb{display:flex;align-items:center;gap:6px;font-size:13px;color:rgba(255,255,255,0.6);cursor:pointer;}
.week-cb input{accent-color:#f472b6;width:14px;height:14px;}
.modal-body{padding:16px 20px;}
.report-out{background:#0f0b10;border-radius:10px;border:0.5px solid rgba(244,114,182,0.08);padding:16px;font-size:13px;line-height:2;color:rgba(255,255,255,0.78);white-space:pre-wrap;font-family:'Noto Sans TC',sans-serif;min-height:200px;max-height:55vh;overflow-y:auto;}
.modal-footer{padding:12px 20px;border-top:0.5px solid rgba(244,114,182,0.08);display:flex;justify-content:flex-end;}
.btn-copy{font-size:13px;padding:6px 20px;border-radius:20px;border:0.5px solid rgba(244,114,182,0.4);color:#f9a8d4;background:rgba(244,114,182,0.1);cursor:pointer;}
.btn-copy:hover{background:rgba(244,114,182,0.2);}
.btn-copy.copied{background:rgba(251,113,133,0.15);color:#fda4af;border-color:rgba(251,113,133,0.4);}
</style>
</head>
<body>

<div class="top-bar">
  <div style="display:flex;align-items:center;gap:10px;">
    <span class="live-dot"></span>
    <div>
      <div class="top-title">Agent 自动化使用情况周报</div>
      <div class="top-sub" id="topSub">商务中心 · 客服组 · 负责人：雨棠</div>
    </div>
  </div>
  <div class="top-right">
    <div class="status-badge loading" id="statusBadge">
      <span class="sdot blink"></span>
      <span id="statusText">读取中...</span>
    </div>
    <button class="pill-report" onclick="openReport()">
      <span class="report-icon"></span>产出报告
    </button>
    <button class="pill" onclick="loadData()">重新整理</button>
  </div>
</div>

<!-- 一、关键指标 -->
<div class="sec-head"><span class="sec-line"></span><span class="sec-title">关键指标总览</span></div>
<div class="metrics" id="metricsArea">
  <div class="mc"><div class="mc-bar b1"></div><div class="mc-label">月度总触发</div><div class="mc-val">—</div></div>
  <div class="mc"><div class="mc-bar b2"></div><div class="mc-label">综合成功率</div><div class="mc-val">—</div></div>
  <div class="mc"><div class="mc-bar b3"></div><div class="mc-label">Token / 字符消耗</div><div class="mc-val">—</div></div>
  <div class="mc"><div class="mc-bar b4"></div><div class="mc-label">活跃 Agent 数</div><div class="mc-val">—</div></div>
</div>

<!-- 周度看板 -->
<div class="sec-head"><span class="sec-line"></span><span class="sec-title">周度看板</span></div>
<div class="kanban" id="kanbanArea">
  <div style="text-align:center;padding:3rem;color:rgba(255,255,255,0.2);font-size:13px;">载入中...</div>
</div>

<div class="divider"></div>

<!-- 六、价值判断 -->
<div class="sec-head"><span class="sec-line"></span><span class="sec-title">本周价值判断</span></div>
<div class="value-grid" id="valueArea"></div>

<div class="divider"></div>

<!-- 七、风险记录 -->
<div class="sec-head"><span class="sec-line"></span><span class="sec-title">风险记录与待优化事项</span></div>
<div class="risk-list" id="riskArea"></div>

<div class="divider"></div>

<!-- 八、演进计划 -->
<div class="sec-head"><span class="sec-line"></span><span class="sec-title">下周自动化演进计划</span></div>
<div class="plan-grid" id="planArea"></div>

<div class="divider"></div>

<!-- 趋势图表 -->
<div class="sec-head"><span class="sec-line"></span><span class="sec-title">趋势图表</span></div>
<div class="two">
  <div class="chart-card"><div class="chart-title">任务触发总数</div><div class="cw"><canvas id="c1"></canvas></div></div>
  <div class="chart-card"><div class="chart-title">任务执行成功率</div><div class="cw"><canvas id="c2"></canvas></div></div>
</div>

<div class="divider"></div>
<div style="font-size:11px;color:rgba(255,255,255,0.4);">高频指令
  <div class="badges" id="badgesArea"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeIfOutside(event)">
  <div class="modal" id="modalBox">
    <div class="modal-header">
      <div class="modal-title"><span class="report-icon"></span>产出报告</div>
      <button class="modal-close" onclick="closeReport()">✕ 关闭</button>
    </div>
    <div class="modal-tabs">
      <div class="tab active" id="tab-week" onclick="switchTab('week')">本周</div>
      <div class="tab" id="tab-month" onclick="switchTab('month')">本月汇总</div>
      <div class="tab" id="tab-custom" onclick="switchTab('custom')">自定义</div>
    </div>
    <div class="modal-divider"></div>
    <div class="custom-select" id="customSelect">
      <div class="custom-label">选择要包含的周次：</div>
      <div class="week-cbs" id="weekCbs"></div>
    </div>
    <div class="modal-body">
      <div class="report-out" id="reportOut">请先载入数据...</div>
    </div>
    <div class="modal-footer">
      <button class="btn-copy" id="copyBtn" onclick="copyReport()">复制全文</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════
// ① 配置：替换为你的 Google Sheet CSV 链接
// ══════════════════════════════════════════
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR4MZC5X5HMRykJcEJ79oPYOsld-qLeiDfkPp2vDf661UR6r5Tp15xuJVYtRzQrMC94AUIvx3cSO6XK/pub?output=csv';

const WEEK_COLORS = [
  {dot:'#f472b6', bar:'linear-gradient(90deg,#f472b6,#a78bfa,#60a5fa,#34d399)'},
  {dot:'#a78bfa', bar:'linear-gradient(90deg,#a78bfa,#60a5fa,#34d399,#f472b6)'},
  {dot:'#60a5fa', bar:'linear-gradient(90deg,#60a5fa,#34d399,#f472b6,#a78bfa)'},
  {dot:'#34d399', bar:'linear-gradient(90deg,#34d399,#f472b6,#a78bfa,#60a5fa)'},
  {dot:'#fb923c', bar:'linear-gradient(90deg,#fb923c,#f472b6,#a78bfa,#60a5fa)'},
];
const CHART_COLORS = ['#f472b6','#a78bfa','#60a5fa','#34d399','#fb923c'];

let chart1 = null, chart2 = null, allData = [], currentTab = 'week';

// ══════════════════════════════════════════
// ② 解析 CSV → 对象数组（按表头自动映射）
// ══════════════════════════════════════════
function parseRows(results) {
  const rows = results.data;
  if (!rows || rows.length < 2) return null;
  const headers = rows[0].map(h => h.trim());
  return rows.slice(1)
    .filter(r => r.some(c => c && c.trim()))
    .map(r => {
      const obj = {};
      headers.forEach((h, i) => obj[h] = (r[i] || '').trim());
      // 数字字段强制转换
      obj['任务触发总数']          = parseFloat(obj['任务触发总数']) || 0;
      obj['任务执行成功率']         = parseFloat(obj['任务执行成功率']) || 0;
      obj['Token / 字符消耗']      = parseFloat(obj['Token / 字符消耗']) || 0;
      obj['活跃 Agent / Bot 数']   = parseFloat(obj['活跃 Agent / Bot 数']) || 0;
      return obj;
    });
}

// ══════════════════════════════════════════
// ③ 场景块：从 row 中提取最多 5 个场景
// ══════════════════════════════════════════
function getScenes(row) {
  const scenes = [];
  for (let n = 1; n <= 5; n++) {
    const name = row[`场景${n}名称`] || '';
    if (!name) continue;
    scenes.push({
      name,
      dept    : row[`所属业务线 / 使用部门`]  || row[`场景${n}所属业务线 / 使用部门`] || '',
      flow    : row[`工作流描述`]              || row[`场景${n}工作流描述`]             || '',
      problem : row[`解决的问题 / 作用`]       || row[`场景${n}解决的问题 / 作用`]      || '',
      output  : row[`本周具体产出`]            || row[`场景${n}本周具体产出`]           || '',
      proof   : row[`产出证明 / 去向`]         || row[`场景${n}产出证明 / 去向`]        || '',
      eff     : row[`效率提升方面`]            || row[`场景${n}效率提升方面`]           || '',
      maturity: row[`成熟度阶段`]             || row[`场景${n}成熟度阶段`]            || '',
      next    : row[`下周动作`]               || row[`场景${n}下周动作`]              || '',
    });
  }
  // 兼容旧逻辑：若场景列没有编号，则尝试直接读场景1名称
  if (scenes.length === 0) {
    const name = row['场景1名称'] || '';
    if (name) {
      scenes.push({
        name,
        dept    : row['所属业务线 / 使用部门'] || '',
        flow    : row['工作流描述']            || '',
        problem : row['解决的问题 / 作用']     || '',
        output  : row['本周具体产出']          || '',
        proof   : row['产出证明 / 去向']       || '',
        eff     : row['效率提升方面']          || '',
        maturity: row['成熟度阶段']           || '',
        next    : row['下周动作']             || '',
      });
    }
  }
  return scenes;
}

// ══════════════════════════════════════════
// ④ 成熟度分层：3.1 / 3.2 / 3.3
// ══════════════════════════════════════════
function getMaturityHtml(row) {
  const items = [
    { label:'已稳定运行 / 可持续复用', name: row['3.1名称'], extra: `用途：${row['3.1用途']||'—'} ｜ 使用频率：${row['3.1使用频率']||'—'}` },
    { label:'正在优化迭代',             name: row['3.2名称'], extra: `进度：${row['3.2当前进度']||'—'} ｜ 本周动作：${row['3.2本周动作']||'—'}` },
    { label:'新增 / 基础设施建设',      name: row['3.3名称'], extra: `目标：${row['3.3目标']||'—'} ｜ 进度：${row['3.3当前进度']||'—'}` },
  ].filter(i => i.name);
  if (!items.length) return '';
  return `<div class="section"><span class="stag">三、自动化资产与成熟度</span><div class="card">
    ${items.map(i => `<div class="sr"><span class="sk">${i.label}</span><span class="sv">${i.name}<span style="font-weight:400;color:#94a3b8;font-size:12px;"> · ${i.extra}</span></span></div>`).join('')}
  </div></div>`;
}

// ══════════════════════════════════════════
// ⑤ 场景卡片 HTML
// ══════════════════════════════════════════
function getScenesHtml(row) {
  const scenes = getScenes(row);
  if (!scenes.length) return '';
  const cards = scenes.map(s => `
    <div class="card">
      <div class="pt">${s.name}</div>
      ${s.dept     ? `<div class="sr"><span class="sk">所属业务线 / 使用部门</span><span class="sv">${s.dept}</span></div>` : ''}
      ${s.flow     ? `<div class="pd" style="margin-top:6px"><span style="color:#f9a8d4;font-size:12px;">工作流 </span>${s.flow}</div>` : ''}
      ${s.problem  ? `<div class="pd"><span style="color:#f9a8d4;font-size:12px;">问题 / 作用 </span>${s.problem}</div>` : ''}
      ${s.output   ? `<div class="pd"><span style="color:#f9a8d4;font-size:12px;">本周产出 </span>${s.output}</div>` : ''}
      ${s.proof    ? `<div class="pd"><span style="color:#f9a8d4;font-size:12px;">产出证明 </span>${s.proof}</div>` : ''}
      ${s.eff      ? `<div class="pd"><span style="color:#f9a8d4;font-size:12px;">效率提升 </span>${s.eff}</div>` : ''}
      ${s.maturity ? `<div class="sr" style="margin-top:4px"><span class="sk">成熟度阶段</span><span class="sv sv-hi">${s.maturity}</span></div>` : ''}
      ${s.next     ? `<div class="pr">${s.next}</div>` : ''}
    </div>`).join('');
  return `<div class="section"><span class="stag">四、重点自动化场景</span>${cards}</div>`;
}

// ══════════════════════════════════════════
// ⑥ 渲染单周卡片
// ══════════════════════════════════════════

  const c = WEEK_COLORS[i % WEEK_COLORS.length];

  const sec1 = `<div class="section"><span class="stag">一、运行数据概览</span><div class="card">

    <div class="sr"><span class="sk">任务触发总数</span><span class="sv">${row['任务触发总数']} 次</span></div>
    <div class="sr"><span class="sk">任务执行成功率</span><span class="sv sv-hi">${row['任务执行成功率']}%</span></div>
    <div class="sr"><span class="sk">Token / 字符消耗</span><span class="sv">${Number(row['Token / 字符消耗']).toLocaleString()}</span></div>
    <div class="sr"><span class="sk">平均响应时长</span><span class="sv">${row['平均响应时长']||'—'}</span></div>
    ${row['统计口径'] ? `<div class="sr"><span class="sk">统计口径</span><span class="sv" style="font-size:12px;color:#94a3b8;">${row['统计口径']}</span></div>` : ''}
    ${row['覆盖部门 / 角色范围'] ? `<div class="sr"><span class="sk">覆盖范围</span><span class="sv" style="font-size:12px;color:#94a3b8;">${row['覆盖部门 / 角色范围']}</span></div>` : ''}
    ${row['Agent / Bot 清单（名称｜用途｜负责人）'] ? `<div class="sr"><span class="sk">Bot 清单</span><span class="sv" style="font-size:12px;color:#94a3b8;">${row['Agent / Bot 清单（名称｜用途｜负责人）']}</span></div>` : ''}
  </div></div>`;

  // 二、本周核心结论
  const conclusions = [1,2,3,4,5]
    .map(n => row[`结论 ${n}`] || row[`结论${n}`])
    .filter(Boolean);
  const sec_concl = conclusions.length ? `<div class="section"><span class="stag">本周核心结论</span><div class="card">
    ${conclusions.map((c,idx)=>`<div class="ri"><span style="color:#f472b6;margin-right:6px;">结论${idx+1}</span>${c}</div>`).join('')}
  </div></div>` : '';

  // 三、成熟度分层
  const sec3 = getMaturityHtml(row);

  // 四、场景详述
  const sec4 = getScenesHtml(row);

  // 五、资源消耗
  const funcs = row['高频功能调用 Top5'] || '';
  const sec5 = `<div class="section"><span class="stag">五、资源消耗</span><div class="card">
    <div class="sr"><span class="sk">Token / 字符消耗</span><span class="sv">${Number(row['Token / 字符消耗']).toLocaleString()}</span></div>
    ${row['预估成本']    ? `<div class="sr"><span class="sk">预估成本</span><span class="sv">${row['预估成本']}</span></div>` : ''}
    ${row['单价 / 口径'] ? `<div class="sr"><span class="sk">单价 / 口径</span><span class="sv" style="font-size:12px;color:#94a3b8;">${row['单价 / 口径']}</span></div>` : ''}
    ${row['统计来源']    ? `<div class="sr"><span class="sk">统计来源</span><span class="sv" style="font-size:12px;color:#94a3b8;">${row['统计来源']}</span></div>` : ''}
    ${funcs ? `<div style="margin-top:6px;display:flex;flex-wrap:wrap;">${funcs.split(/[，,、\n]/).filter(f=>f.trim()).map(f=>`<span class="func-tag">${f.trim()}</span>`).join('')}</div>` : ''}
  </div></div>`;

  return `<div class="week-col">
    <div class="wh-bar" style="background:${c.bar};"></div>
    <div class="week-head">
      <span class="week-dot" style="background:${c.dot};"></span>
      <span class="week-label">${row['周次']}</span>
      <span class="week-period">${row['汇报周期']||''}</span>
    </div>
    <div class="week-body">${sec_concl}${sec1}${sec3}${sec4}${sec5}</div>
  </div>`;
}

// ⑦ 渲染关键指标
// ══════════════════════════════════════════
function renderMetrics(data) {
  const total     = data.reduce((s,r) => s + r['任务触发总数'], 0);
  const avgRate   = (data.reduce((s,r) => s + r['任务执行成功率'], 0) / data.length).toFixed(1);
  const totalChar = data.reduce((s,r) => s + r['Token / 字符消耗'], 0);
  const maxAgents = Math.max(...data.map(r => r['活跃 Agent / Bot 数']));
  const best      = data.reduce((a,b) => a['任务执行成功率'] > b['任务执行成功率'] ? a : b);
  document.getElementById('metricsArea').innerHTML = `
    <div class="mc"><div class="mc-bar b1"></div><div class="mc-label">月度总触发</div><div class="mc-val">${total.toLocaleString()}</div><div class="mc-note">${data.length} 周累计</div></div>
    <div class="mc"><div class="mc-bar b2"></div><div class="mc-label">综合成功率</div><div class="mc-val">${avgRate}%</div><div class="mc-note">最高 ${best['任务执行成功率']}%（${best['周次']}）</div></div>
    <div class="mc"><div class="mc-bar b3"></div><div class="mc-label">Token / 字符消耗</div><div class="mc-val">${totalChar.toLocaleString()}</div><div class="mc-note">${data.length} 周累计</div></div>
    <div class="mc"><div class="mc-bar b4"></div><div class="mc-label">活跃 Agent 数</div><div class="mc-val">${maxAgents}</div><div class="mc-note">当前最大值</div></div>`;
}

// ══════════════════════════════════════════
// ⑩ 渲染风险记录（第七项）
// ══════════════════════════════════════════
function renderRisks(data) {
  const row  = data[0];
  const risks = [];
  for (let n = 1; n <= 5; n++) {
    const desc = row[`风险 / 异常${n}现象描述`] || row[`风险 / 异常 ${n} 现象描述`] || '';
    if (!desc) continue;
    risks.push({
      n,
      desc,
      range    : row[`风险 / 异常${n}影响范围`]  || row[`风险 / 异常 ${n} 影响范围`]  || '',
      strategy : row[`风险 / 异常${n}应对策略`]  || row[`风险 / 异常 ${n} 应对策略`]  || '',
      owner    : row[`风险 / 异常${n}责任人`]    || row[`风险 / 异常 ${n} 责任人`]    || '',
      deadline : row[`风险 / 异常${n}截止时间`]  || row[`风险 / 异常 ${n} 截止时间`]  || '',
    });
  }
  document.getElementById('riskArea').innerHTML = risks.length
    ? risks.map(r => `<div class="risk-card">
        <div class="risk-title"><span class="risk-dot"></span>风险 / 异常 ${r.n}</div>
        <div class="card" style="background:#0f0b10;border-color:rgba(251,100,80,0.08);">
          ${r.desc     ? `<div class="sr"><span class="sk">现象描述</span><span class="sv">${r.desc}</span></div>` : ''}
          ${r.range    ? `<div class="sr"><span class="sk">影响范围</span><span class="sv">${r.range}</span></div>` : ''}
          ${r.strategy ? `<div class="sr"><span class="sk">应对策略</span><span class="sv">${r.strategy}</span></div>` : ''}
          ${r.owner    ? `<div class="sr"><span class="sk">责任人</span><span class="sv">${r.owner}</span></div>` : ''}
          ${r.deadline ? `<div class="sr"><span class="sk">截止时间</span><span class="sv sv-hi">${r.deadline}</span></div>` : ''}
        </div>
      </div>`).join('')
    : '<div style="color:rgba(255,255,255,0.2);font-size:13px;padding:1rem;">（本周无风险记录）</div>';
}

// ══════════════════════════════════════════
// ⑫ 渲染图表
// ══════════════════════════════════════════
function renderCharts(data) {
  const tc = 'rgba(255,255,255,0.3)', gc = 'rgba(255,255,255,0.05)';
  const labels = data.map(r => r['周次']);
  const base = {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: {
      x: { ticks:{color:tc,font:{size:11}}, grid:{color:gc}, border:{display:false} },
      y: { ticks:{color:tc,font:{size:11}}, grid:{color:gc}, border:{display:false} }
    }
  };
  const bc = data.map((_,i) => CHART_COLORS[i % CHART_COLORS.length]);
  if (chart1) chart1.destroy();
  if (chart2) chart2.destroy();
  chart1 = new Chart(document.getElementById('c1'), {
    type: 'bar',
    data: { labels, datasets: [{ data: data.map(r => r['任务触发总数']), backgroundColor: bc.map(c=>c+'99'), borderColor: bc, borderWidth:1, borderRadius:5 }] },
    options: base
  });
  chart2 = new Chart(document.getElementById('c2'), {
    type: 'line',
    data: { labels, datasets: [{ data: data.map(r => r['任务执行成功率']), borderColor:'#f472b6', backgroundColor:'rgba(244,114,182,0.08)', pointBackgroundColor:'#f472b6', pointRadius:5, tension:0.3, fill:true }] },
    options: { ...base, scales: { ...base.scales, y: { ...base.scales.y, min:60, max:100, ticks:{...base.scales.y.ticks, callback: v => v+'%'} } } }
  });

  // 高频标签
  const allFuncs = [...new Set(data.flatMap(r =>
    (r['高频功能调用 Top5']||'').split(/[，,、\n]/).map(f=>f.trim()).filter(Boolean)
  ))];
  document.getElementById('badgesArea').innerHTML = allFuncs.map(f => `<span class="badge">${f}</span>`).join('');
}

// ══════════════════════════════════════════
// ⑬ 报告生成
// ══════════════════════════════════════════
function generateWeekReport(row) {
  let r = '';
  r += `Agent 自动化使用情况周报（${row['周次']}）\n`;
  r += `汇报周期：${row['汇报周期']||'—'}\n`;
  r += `汇报人：${row['汇报人']||'—'}\n`;
  r += `部门 / 项目：${row['部门 / 项目']||'—'}\n`;
  r += `汇报日期：${row['汇报日期']||'—'}\n`;

  // 一、核心结论
  const conclusions = [1,2,3,4,5].map(n => row[`结论 ${n}`]||row[`结论${n}`]).filter(Boolean);
  if (conclusions.length) {
    r += `\n一、本周核心结论\n`;
    conclusions.forEach((c,i) => r += `结论 ${i+1}：${c}\n`);
  }

  // 二、运行数据
  r += `\n二、运行数据概览\n`;
  r += `◆ 活跃 Agent / Bot 数：${row['活跃 Agent / Bot 数']}个\n`;
  r += `◆ 任务触发总数：${row['任务触发总数']}次\n`;
  r += `◆ 任务执行成功率：${row['任务执行成功率']}%\n`;
  r += `◆ Token / 字符消耗：${Number(row['Token / 字符消耗']).toLocaleString()}\n`;
  r += `◆ 平均响应时长：${row['平均响应时长']||'—'}\n`;
  if (row['统计口径'])           r += `◆ 统计口径：${row['统计口径']}\n`;
  if (row['覆盖部门 / 角色范围']) r += `◆ 覆盖部门 / 角色范围：${row['覆盖部门 / 角色范围']}\n`;

  // 三、成熟度
  if (row['3.1名称']||row['3.2名称']||row['3.3名称']) {
    r += `\n三、自动化资产与成熟度分层\n`;
    if (row['3.1名称']) r += `◆ 已稳定运行：${row['3.1名称']} ｜ 用途：${row['3.1用途']||'—'} ｜ 使用频率：${row['3.1使用频率']||'—'}\n`;
    if (row['3.2名称']) r += `◆ 正在优化迭代：${row['3.2名称']} ｜ 进度：${row['3.2当前进度']||'—'} ｜ 本周动作：${row['3.2本周动作']||'—'}\n`;
    if (row['3.3名称']) r += `◆ 新增基建：${row['3.3名称']} ｜ 目标：${row['3.3目标']||'—'} ｜ 进度：${row['3.3当前进度']||'—'}\n`;
  }

  // 四、场景
  const scenes = getScenes(row);
  if (scenes.length) {
    r += `\n四、本周重点自动化场景详述\n`;
    scenes.forEach((s,i) => {
      r += `\n场景 ${i+1}：${s.name}\n`;
      if (s.dept)     r += `◆ 所属业务线 / 使用部门：${s.dept}\n`;
      if (s.flow)     r += `◆ 工作流描述：${s.flow}\n`;
      if (s.problem)  r += `◆ 解决的问题 / 作用：${s.problem}\n`;
      if (s.output)   r += `◆ 本周具体产出：${s.output}\n`;
      if (s.proof)    r += `◆ 产出证明 / 去向：${s.proof}\n`;
      if (s.eff)      r += `◆ 效率提升方面：${s.eff}\n`;
      if (s.maturity) r += `◆ 成熟度阶段：${s.maturity}\n`;
      if (s.next)     r += `◆ 下周动作：${s.next}\n`;
    });
  }

  // 五、资源消耗
  r += `\n五、资源消耗与调用情况\n`;
  r += `◆ Token / 字符消耗：${Number(row['Token / 字符消耗']).toLocaleString()}\n`;
  if (row['预估成本'])          r += `◆ 预估成本：${row['预估成本']}\n`;
  if (row['单价 / 口径'])       r += `◆ 单价 / 口径：${row['单价 / 口径']}\n`;
  if (row['统计来源'])          r += `◆ 统计来源：${row['统计来源']}\n`;
  if (row['高频功能调用 Top5']) r += `◆ 高频功能调用 Top5：${row['高频功能调用 Top5']}\n`;

  // 六、价值判断
  const valDims = ['业务触达层面','组织价值层面','交付成熟度层面','管理决策依据层面'];
  if (valDims.some(k => row[k])) {
    r += `\n六、本周价值判断\n`;
    valDims.forEach(k => { if (row[k]) r += `◆ ${k}：${row[k]}\n`; });
  }

  // 七、风险
  const hasRisk = [1,2,3,4,5].some(n => row[`风险 / 异常${n}现象描述`]||row[`风险 / 异常 ${n} 现象描述`]);
  if (hasRisk) {
    r += `\n七、风险记录与待优化事项\n`;
    for (let n=1;n<=5;n++){
      const desc = row[`风险 / 异常${n}现象描述`]||row[`风险 / 异常 ${n} 现象描述`]||'';
      if (!desc) continue;
      r += `\n风险 / 异常 ${n}\n`;
      r += `◆ 现象描述：${desc}\n`;
      const range    = row[`风险 / 异常${n}影响范围`]||row[`风险 / 异常 ${n} 影响范围`]||'';
      const strategy = row[`风险 / 异常${n}应对策略`]||row[`风险 / 异常 ${n} 应对策略`]||'';
      const owner    = row[`风险 / 异常${n}责任人`]||row[`风险 / 异常 ${n} 责任人`]||'';
      const deadline = row[`风险 / 异常${n}截止时间`]||row[`风险 / 异常 ${n} 截止时间`]||'';
      if (range)    r += `◆ 影响范围：${range}\n`;
      if (strategy) r += `◆ 应对策略：${strategy}\n`;
      if (owner)    r += `◆ 责任人：${owner}\n`;
      if (deadline) r += `◆ 截止时间：${deadline}\n`;
    }
  }

  // 八、演进计划
  const hasPlans = [1,2,3,4].some(n => row[`★目标${n}目标描述`]||row[`★目标 ${n} 目标描述`]);
  if (hasPlans) {
    r += `\n八、下周自动化演进计划\n`;
    for (let n=1;n<=4;n++){
      const desc = row[`★目标${n}目标描述`]||row[`★目标 ${n} 目标描述`]||'';
      if (!desc) continue;
      r += `\n目标 ${n}\n`;
      r += `◆ 目标描述：${desc}\n`;
      const kpi      = row[`★目标${n}验收指标`]||row[`★目标 ${n} 验收指标`]||'';
      const owner    = row[`★目标${n}责任人`]||row[`★目标 ${n} 责任人`]||'';
      const deadline = row[`★目标${n}截止时间`]||row[`★目标 ${n} 截止时间`]||'';
      if (kpi)      r += `◆ 验收指标：${kpi}\n`;
      if (owner)    r += `◆ 责任人：${owner}\n`;
      if (deadline) r += `◆ 截止时间：${deadline}\n`;
    }
  }
  return r.trim();
}

function generateMonthlyReport(rows) {
  if (!rows || !rows.length) return '没有可用的数据';
  const first = rows[0], last = rows[rows.length-1];
  const total     = rows.reduce((s,r) => s + r['任务触发总数'], 0);
  const avgRate   = (rows.reduce((s,r) => s + r['任务执行成功率'], 0) / rows.length).toFixed(2);
  const totalChar = rows.reduce((s,r) => s + r['Token / 字符消耗'], 0);
  const maxAgents = Math.max(...rows.map(r => r['活跃 Agent / Bot 数']));
  const best      = rows.reduce((a,b) => a['任务执行成功率']>b['任务执行成功率']?a:b);
  let r = '';
  r += `Agent 自动化使用情况月报（${first['周次']}–${last['周次']}）\n`;
  r += `汇报人：${last['汇报人']||'—'} ｜ 部门 / 项目：${last['部门 / 项目']||'—'}\n`;
  r += `\n一、运行数据总览\n`;
  r += `◆ 活跃 Agent / Bot 数（最高）：${maxAgents}个\n`;
  r += `◆ 月度任务触发总数：${total.toLocaleString()}次（共 ${rows.length} 周）\n`;
  r += `◆ 平均任务执行成功率：${avgRate}%（最高 ${best['任务执行成功率']}%，${best['周次']}）\n`;
  r += `◆ 总 Token / 字符消耗：${totalChar.toLocaleString()}\n`;
  r += `\n二、核心自动化进展汇总\n`;
  rows.forEach(row => {
    r += `【${row['周次']}】\n`;
    getScenes(row).forEach((s,i) => {
      r += `场景 ${i+1}：${s.name}\n`;
      if (s.output) r += `◆ 产出：${s.output}\n`;
    });
  });
  r += `\n三、风险记录汇总\n`;
  rows.forEach(row => {
    for (let n=1;n<=5;n++){
      const desc = row[`风险 / 异常${n}现象描述`]||row[`风险 / 异常 ${n} 现象描述`]||'';
      if (desc) r += `◆ ${row['周次']} 风险${n}：${desc}\n`;
    }
  });
  return r.trim();
}

function generateCustomReport(rows) {
  return rows.map(r => generateWeekReport(r)).join('\n\n' + '─'.repeat(40) + '\n\n');
}

// ══════════════════════════════════════════
// ⑭ Modal 控制
// ══════════════════════════════════════════
function openReport() {
  if (!allData.length) { alert('请先载入数据'); return; }
  document.getElementById('modalOverlay').classList.add('show');
  buildWeekCbs();
  switchTab('week');
}
function closeReport() { document.getElementById('modalOverlay').classList.remove('show'); }
function closeIfOutside(e) { if (e.target === document.getElementById('modalOverlay')) closeReport(); }
function buildWeekCbs() {
  document.getElementById('weekCbs').innerHTML = allData.map((row,i) =>
    `<label class="week-cb"><input type="checkbox" value="${i}" checked onchange="refreshCustom()">${row['周次']}</label>`
  ).join('');
}
function switchTab(tab) {
  currentTab = tab;
  ['week','month','custom'].forEach(t => document.getElementById('tab-'+t).classList.toggle('active', t===tab));
  document.getElementById('customSelect').classList.toggle('show', tab==='custom');
  const btn = document.getElementById('copyBtn');
  btn.classList.remove('copied'); btn.textContent = '复制全文';
  if (tab==='week')       document.getElementById('reportOut').textContent = generateWeekReport(allData[0]);
  else if (tab==='month') document.getElementById('reportOut').textContent = generateMonthlyReport(allData);
  else                    refreshCustom();
}
function refreshCustom() {
  const checked = [...document.querySelectorAll('#weekCbs input:checked')].map(cb => allData[parseInt(cb.value)]);
  document.getElementById('reportOut').textContent = checked.length ? generateCustomReport(checked) : '请至少选择一周';
}
function copyReport() {
  navigator.clipboard.writeText(document.getElementById('reportOut').textContent).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '已复制 ✓'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '复制全文'; btn.classList.remove('copied'); }, 2000);
  });
}

// ══════════════════════════════════════════
// ⑮ 主加载
// ══════════════════════════════════════════
function setStatus(type, text) {
  const b = document.getElementById('statusBadge');
  b.className = 'status-badge ' + type;
  b.innerHTML = `<span class="sdot${type==='loading'?' blink':''}"></span><span>${text}</span>`;
}

async function loadData() {
  setStatus('loading', '读取中...');
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const parsed = Papa.parse(text, { skipEmptyLines: true });
    const data = parseRows(parsed);
    if (!data || !data.length) throw new Error('无数据');
    allData = data.reverse(); // 最新在前
    renderMetrics(data);
    renderKanban(data);
    renderValue(data);
    renderRisks(data);
    renderPlans(data);
    renderCharts(data);
    const now = new Date().toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit' });
    setStatus('ok', '已同步 ' + now);
  } catch(e) {
    setStatus('err', '读取失败：' + e.message);
  }
}

loadData();
</script>
